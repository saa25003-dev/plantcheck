<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作物生育記録 (AgriLog)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            800: '#166534',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">

    <!-- Header -->
    <header class="bg-gradient-to-r from-emerald-700 to-teal-800 text-white shadow-lg sticky top-0 z-30">
        <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-white/20 p-2 rounded-xl backdrop-blur-md">
                    <i class="fa-solid font-bold fa-seedling text-emerald-300 text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight">AgriLog</h1>
                    <p class="text-xs text-emerald-200">作物生育記録ノート</p>
                </div>
            </div>
            
            <!-- Auth Status / Sign-in Button -->
            <div id="auth-container" class="flex items-center gap-3">
                <div id="user-info" class="hidden flex items-center gap-2 bg-emerald-900/40 px-3 py-1.5 rounded-full border border-emerald-500/30">
                    <img id="user-avatar" class="w-7 h-7 rounded-full border border-white/50" src="" alt="Avatar">
                    <span id="user-name" class="text-xs font-medium max-w-[100px] truncate hidden sm:inline"></span>
                    <button id="logout-btn" title="ログアウト" class="text-emerald-200 hover:text-white text-xs ml-1 transition">
                        <i class="fa-solid fa-right-from-bracket"></i>
                    </button>
                </div>
                <button id="google-login-btn" class="flex items-center gap-2 bg-white text-slate-700 hover:bg-slate-100 font-semibold text-xs px-3.5 py-2 rounded-full shadow-sm transition active:scale-95">
                    <i class="fa-brands fa-google text-red-500"></i>
                    <span>Google ログイン</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-5xl mx-auto px-4 pt-6 space-y-6">

        <!-- Toast Notification Area -->
        <div id="toast" class="fixed bottom-5 right-5 z-50 transform transition-all duration-300 translate-y-20 opacity-0 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3 border border-slate-700 text-sm">
            <i id="toast-icon" class="fa-solid fa-circle-check text-emerald-400"></i>
            <span id="toast-message">操作が完了しました</span>
        </div>

        <!-- Form Section -->
        <section class="bg-white rounded-2xl p-5 sm:p-6 shadow-sm border border-slate-100">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                    <i class="fa-solid fa-pen-to-square text-emerald-600"></i>
                    <span id="form-title">新規データ入力</span>
                </h2>
                <button id="cancel-edit-btn" class="hidden text-xs text-slate-500 hover:text-slate-700 underline">
                    キャンセル
                </button>
            </div>

            <form id="crop-form" class="space-y-4">
                <input type="hidden" id="record-id">

                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                    <!-- 作物名 -->
                    <div>
                        <label for="crop-name" class="block text-xs font-semibold text-slate-600 mb-1">
                            作物名 <span class="text-red-500">*</span>
                        </label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                                <i class="fa-solid fa-leaf text-xs"></i>
                            </span>
                            <input type="text" id="crop-name" required placeholder="例: トマト, ナス" 
                                class="w-full pl-9 pr-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-transparent outline-none transition">
                        </div>
                    </div>

                    <!-- 日付 -->
                    <div>
                        <label for="log-date" class="block text-xs font-semibold text-slate-600 mb-1">
                            測定日 <span class="text-red-500">*</span>
                        </label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                                <i class="fa-regular fa-calendar text-xs"></i>
                            </span>
                            <input type="date" id="log-date" required 
                                class="w-full pl-9 pr-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-transparent outline-none transition">
                        </div>
                    </div>

                    <!-- 草丈 -->
                    <div>
                        <label for="plant-height" class="block text-xs font-semibold text-slate-600 mb-1">
                            草丈 (cm) <span class="text-red-500">*</span>
                        </label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                                <i class="fa-solid fa-ruler-vertical text-xs"></i>
                            </span>
                            <input type="number" step="0.1" min="0" id="plant-height" required placeholder="例: 25.5" 
                                class="w-full pl-9 pr-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-transparent outline-none transition">
                        </div>
                    </div>

                    <!-- 葉枚数 -->
                    <div>
                        <label for="leaf-count" class="block text-xs font-semibold text-slate-600 mb-1">
                            葉枚数 (枚) <span class="text-red-500">*</span>
                        </label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                                <i class="fa-solid fa-tree text-xs"></i>
                            </span>
                            <input type="number" step="1" min="0" id="leaf-count" required placeholder="例: 8" 
                                class="w-full pl-9 pr-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-transparent outline-none transition">
                        </div>
                    </div>
                </div>

                <!-- メモ -->
                <div>
                    <label for="notes" class="block text-xs font-semibold text-slate-600 mb-1">メモ・観察記録</label>
                    <textarea id="notes" rows="2" placeholder="追肥を実施、害虫なし、開花を確認など..." 
                        class="w-full px-3 py-2 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-emerald-500 focus:border-transparent outline-none transition resize-none"></textarea>
                </div>

                <!-- 送信ボタン -->
                <div class="flex justify-end">
                    <button type="submit" id="submit-btn" 
                        class="w-full sm:w-auto bg-emerald-600 hover:bg-emerald-700 text-white font-semibold px-6 py-2.5 rounded-xl shadow-md hover:shadow-lg active:scale-95 transition flex items-center justify-center gap-2">
                        <i class="fa-solid fa-cloud-arrow-up"></i>
                        <span id="submit-btn-text">保存する</span>
                    </button>
                </div>
            </form>
        </section>

        <!-- Chart Section -->
        <section class="bg-white rounded-2xl p-5 sm:p-6 shadow-sm border border-slate-100">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
                <div>
                    <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                        <i class="fa-solid fa-chart-line text-emerald-600"></i>
                        生育推移グラフ
                    </h2>
                    <p class="text-xs text-slate-500">選択した作物の草丈と葉枚数の変化を表示します</p>
                </div>
                <!-- グラフ対象作物の選択 -->
                <div class="flex items-center gap-2">
                    <label for="chart-crop-select" class="text-xs text-slate-500 whitespace-nowrap">表示作物:</label>
                    <select id="chart-crop-select" class="bg-slate-100 border border-slate-200 rounded-xl px-3 py-1.5 text-xs text-slate-700 font-medium focus:outline-none focus:ring-2 focus:ring-emerald-500">
                        <!-- 動的に挿入 -->
                    </select>
                </div>
            </div>

            <div class="relative w-full h-64 sm:h-72">
                <canvas id="growthChart"></canvas>
            </div>
        </section>

        <!-- Filter & List Controls -->
        <section class="space-y-4">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 bg-white p-4 rounded-2xl border border-slate-100 shadow-sm">
                <!-- フィルタ機能 -->
                <div class="flex items-center gap-2 overflow-x-auto pb-1 sm:pb-0">
                    <span class="text-xs font-semibold text-slate-500 whitespace-nowrap"><i class="fa-solid fa-filter mr-1"></i>絞り込み:</span>
                    <select id="filter-crop" class="bg-slate-100 border border-slate-200 rounded-xl px-3 py-1.5 text-xs text-slate-700 font-medium focus:outline-none focus:ring-2 focus:ring-emerald-500">
                        <option value="ALL">すべての作物</option>
                        <!-- 動的に選択肢を追加 -->
                    </select>
                </div>

                <!-- ソート機能 -->
                <div class="flex items-center gap-2">
                    <span class="text-xs font-semibold text-slate-500 whitespace-nowrap"><i class="fa-solid fa-arrow-down-wide-short mr-1"></i>並び順:</span>
                    <select id="sort-order" class="bg-slate-100 border border-slate-200 rounded-xl px-3 py-1.5 text-xs text-slate-700 font-medium focus:outline-none focus:ring-2 focus:ring-emerald-500">
                        <option value="date-desc">日付: 新しい順</option>
                        <option value="date-asc">日付: 古い順</option>
                        <option value="height-desc">草丈: 高い順</option>
                        <option value="leaf-desc">葉枚数: 多い順</option>
                    </select>
                </div>
            </div>

            <!-- Record Cards / List -->
            <div id="records-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Javascriptでデータカードを差し込み -->
            </div>

            <!-- 空状態の表示 -->
            <div id="empty-state" class="hidden text-center py-12 bg-white rounded-2xl border border-dashed border-slate-200 p-6">
                <div class="w-16 h-16 bg-emerald-50 text-emerald-500 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl">
                    <i class="fa-solid fa-plant-wilt"></i>
                </div>
                <h3 class="text-sm font-bold text-slate-700">データがありません</h3>
                <p class="text-xs text-slate-400 mt-1">上のフォームから初めての生育記録を登録してみましょう！</p>
            </div>
        </section>
    </main>

    <!-- Custom Modal: Delete Confirmation -->
    <div id="delete-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black/50 backdrop-blur-sm p-4">
        <div class="bg-white rounded-2xl p-6 max-w-sm w-full shadow-xl space-y-4 transform transition-all scale-95 opacity-0 duration-200" id="delete-modal-card">
            <div class="text-center">
                <div class="w-12 h-12 bg-red-100 text-red-500 rounded-full flex items-center justify-center mx-auto mb-3 text-xl">
                    <i class="fa-solid fa-trash-can"></i>
                </div>
                <h3 class="text-base font-bold text-slate-800">記録の削除</h3>
                <p class="text-xs text-slate-500 mt-1">この操作は取り消せません。本当に削除しますか？</p>
            </div>
            <div class="flex gap-3 pt-2">
                <button id="cancel-delete-btn" class="flex-1 py-2 text-xs font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-xl transition">
                    キャンセル
                </button>
                <button id="confirm-delete-btn" class="flex-1 py-2 text-xs font-semibold text-white bg-red-600 hover:bg-red-700 rounded-xl shadow transition">
                    削除する
                </button>
            </div>
        </div>
    </div>

    <!-- Firebase Script (Module) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { 
            getAuth, 
            signInWithPopup, 
            GoogleAuthProvider, 
            signOut, 
            onAuthStateChanged,
            signInAnonymously,
            signInWithCustomToken
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { 
            getFirestore, 
            collection, 
            doc, 
            addDoc, 
            updateDoc, 
            deleteDoc, 
            onSnapshot 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // ※ 自身のFirebase設定に置き換えて使用することもできます
        const firebaseConfig = typeof __firebase_config !== 'undefined' 
            ? JSON.parse(__firebase_config) 
            : {
                apiKey: "AIzaSyDummyKeyForTemplateCode12345678",
                authDomain: "crop-tracker.firebaseapp.com",
                projectId: "crop-tracker",
                storageBucket: "crop-tracker.appspot.com",
                messagingSenderId: "1234567890",
                appId: "1:1234567890:web:abcdef123456"
            };

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'crop-tracker-app';

        // Firebase Initializations
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Global State
        let currentUser = null;
        let records = [];
        let unsubscribeStore = null;
        let chartInstance = null;
        let deleteTargetId = null;

        // DOM Elements
        const form = document.getElementById('crop-form');
        const recordIdInput = document.getElementById('record-id');
        const cropNameInput = document.getElementById('crop-name');
        const logDateInput = document.getElementById('log-date');
        const plantHeightInput = document.getElementById('plant-height');
        const leafCountInput = document.getElementById('leaf-count');
        const notesInput = document.getElementById('notes');
        const submitBtn = document.getElementById('submit-btn');
        const submitBtnText = document.getElementById('submit-btn-text');
        const formTitle = document.getElementById('form-title');
        const cancelEditBtn = document.getElementById('cancel-edit-btn');
        
        const filterCropSelect = document.getElementById('filter-crop');
        const sortOrderSelect = document.getElementById('sort-order');
        const chartCropSelect = document.getElementById('chart-crop-select');
        const recordsContainer = document.getElementById('records-container');
        const emptyState = document.getElementById('empty-state');

        const googleLoginBtn = document.getElementById('google-login-btn');
        const userInfo = document.getElementById('user-info');
        const userAvatar = document.getElementById('user-avatar');
        const userName = document.getElementById('user-name');
        const logoutBtn = document.getElementById('logout-btn');

        // デフォルトの日付に今日を設定
        logDateInput.value = new Date().toISOString().split('T')[0];

        // Authentication handling
        async function initializeAuth() {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                try {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } catch (e) {
                    console.warn("Custom token auth failed, fallback to anonymous", e);
                    await signInAnonymously(auth);
                }
            } else {
                // 初期状態として匿名サインインを実行（ログイン前の試用環境確保）
                onAuthStateChanged(auth, async (user) => {
                    if (!user) {
                        try {
                            await signInAnonymously(auth);
                        } catch (err) {
                            console.error("Anonymous sign in failed", err);
                        }
                    }
                });
            }
        }

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (user) {
                if (!user.isAnonymous) {
                    // Google ログイン済みの場合
                    userInfo.classList.remove('hidden');
                    googleLoginBtn.classList.add('hidden');
                    userAvatar.src = user.photoURL || 'https://placehold.co/100x100/22c55e/ffffff?text=User';
                    userName.textContent = user.displayName || 'ユーザー';
                } else {
                    // 匿名ログイン状態
                    userInfo.classList.add('hidden');
                    googleLoginBtn.classList.remove('hidden');
                }
                // データ読み込みの購読開始
                subscribeToRecords();
            }
        });

        // Google Sign-In Event
        googleLoginBtn.addEventListener('click', async () => {
            const provider = new GoogleAuthProvider();
            try {
                await signInWithPopup(auth, provider);
                showToast('Googleアカウントでログインしました', 'success');
            } catch (error) {
                console.error("Login failed:", error);
                showToast('ログインに失敗しました', 'error');
            }
        });

        // Logout Event
        logoutBtn.addEventListener('click', async () => {
            try {
                await signOut(auth);
                await signInAnonymously(auth);
                showToast('ログアウトしました', 'info');
            } catch (error) {
                console.error("Logout failed:", error);
            }
        });

        // Get collection path according to rule
        function getCollectionPath() {
            if (!currentUser) return null;
            // ユーザー固有パス: /artifacts/{appId}/users/{userId}/crop_logs
            return collection(db, 'artifacts', appId, 'users', currentUser.uid, 'crop_logs');
        }

        // Realtime Data Subscription
        function subscribeToRecords() {
            if (unsubscribeStore) unsubscribeStore();

            const colRef = getCollectionPath();
            if (!colRef) return;

            // クエリでの複雑なソートを避けメモリで処理 (RULE 2 準拠)
            unsubscribeStore = onSnapshot(colRef, (snapshot) => {
                records = [];
                snapshot.forEach((doc) => {
                    records.push({ id: doc.id, ...doc.data() });
                });
                updateUI();
            }, (error) => {
                console.error("Firestore Subscribe Error:", error);
                showToast('データの取得に失敗しました', 'error');
            });
        }

        // Update Filter Selects, List, and Chart
        function updateUI() {
            updateCropFilterOptions();
            renderRecords();
            renderChart();
        }

        // 作物名一覧のセレクトオプションを動的生成
        function updateCropFilterOptions() {
            const currentFilter = filterCropSelect.value;
            const currentChartCrop = chartCropSelect.value;

            // ユニークな作物名を抽出
            const crops = Array.from(new Set(records.map(r => r.cropName).filter(Boolean)));

            // フィルターセレクトボックスの更新
            filterCropSelect.innerHTML = '<option value="ALL">すべての作物</option>';
            crops.forEach(crop => {
                const opt = document.createElement('option');
                opt.value = crop;
                opt.textContent = crop;
                filterCropSelect.appendChild(opt);
            });
            if (crops.includes(currentFilter)) {
                filterCropSelect.value = currentFilter;
            }

            // グラフセレクトボックスの更新
            chartCropSelect.innerHTML = '';
            if (crops.length === 0) {
                const opt = document.createElement('option');
                opt.value = "";
                opt.textContent = "データなし";
                chartCropSelect.appendChild(opt);
            } else {
                crops.forEach(crop => {
                    const opt = document.createElement('option');
                    opt.value = crop;
                    opt.textContent = crop;
                    chartCropSelect.appendChild(opt);
                });
                if (crops.includes(currentChartCrop)) {
                    chartCropSelect.value = currentChartCrop;
                }
            }
        }

        // フィルタ・ソートされたデータ一覧のレンダリング
        function renderRecords() {
            const filterValue = filterCropSelect.value;
            const sortValue = sortOrderSelect.value;

            // 1. フィルタリング
            let filtered = records.filter(r => {
                if (filterValue === 'ALL') return true;
                return r.cropName === filterValue;
            });

            // 2. ソート (JavaScript メモリ内処理)
            filtered.sort((a, b) => {
                if (sortValue === 'date-desc') {
                    return new Date(b.date) - new Date(a.date);
                } else if (sortValue === 'date-asc') {
                    return new Date(a.date) - new Date(b.date);
                } else if (sortValue === 'height-desc') {
                    return b.height - a.height;
                } else if (sortValue === 'leaf-desc') {
                    return b.leafCount - a.leafCount;
                }
                return 0;
            });

            recordsContainer.innerHTML = '';

            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            filtered.forEach(record => {
                const card = document.createElement('div');
                card.className = "bg-white p-5 rounded-2xl border border-slate-100 shadow-sm hover:shadow-md transition flex flex-col justify-between space-y-3";
                
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start mb-2">
                            <span class="inline-block bg-emerald-100 text-emerald-800 text-xs font-bold px-2.5 py-1 rounded-lg">
                                <i class="fa-solid fa-seedling mr-1"></i>${escapeHtml(record.cropName)}
                            </span>
                            <span class="text-xs font-medium text-slate-400">
                                <i class="fa-regular fa-calendar mr-1"></i>${record.date}
                            </span>
                        </div>
                        <div class="grid grid-cols-2 gap-2 my-3 bg-slate-50 p-2.5 rounded-xl border border-slate-100">
                            <div>
                                <p class="text-[10px] uppercase tracking-wider text-slate-400 font-semibold">草丈</p>
                                <p class="text-base font-bold text-slate-700">${record.height} <span class="text-xs font-normal text-slate-500">cm</span></p>
                            </div>
                            <div>
                                <p class="text-[10px] uppercase tracking-wider text-slate-400 font-semibold">葉枚数</p>
                                <p class="text-base font-bold text-slate-700">${record.leafCount} <span class="text-xs font-normal text-slate-500">枚</span></p>
                            </div>
                        </div>
                        ${record.notes ? `
                            <p class="text-xs text-slate-600 bg-emerald-50/50 p-2 rounded-lg border border-emerald-100/50">
                                <i class="fa-regular fa-comment-dots text-emerald-500 mr-1"></i>${escapeHtml(record.notes)}
                            </p>
                        ` : ''}
                    </div>
                    <div class="flex justify-end gap-2 pt-2 border-t border-slate-100">
                        <button class="edit-btn text-xs text-slate-500 hover:text-emerald-600 px-2 py-1 rounded-lg hover:bg-slate-50 transition" data-id="${record.id}">
                            <i class="fa-solid fa-pen mr-1"></i>編集
                        </button>
                        <button class="delete-btn text-xs text-slate-500 hover:text-red-600 px-2 py-1 rounded-lg hover:bg-slate-50 transition" data-id="${record.id}">
                            <i class="fa-solid fa-trash mr-1"></i>削除
                        </button>
                    </div>
                `;

                // イベントリスナー設定
                card.querySelector('.edit-btn').addEventListener('click', () => editRecord(record));
                card.querySelector('.delete-btn').addEventListener('click', () => promptDelete(record.id));

                recordsContainer.appendChild(card);
            });
        }

        // Chart.js グラフ表示ロジック
        function renderChart() {
            const ctx = document.getElementById('growthChart').getContext('2d');
            const targetCrop = chartCropSelect.value;

            // 指定された作物の記録を抽出し、日付順(昇順)に整列
            let cropData = records.filter(r => r.cropName === targetCrop);
            cropData.sort((a, b) => new Date(a.date) - new Date(b.date));

            const labels = cropData.map(r => r.date);
            const heights = cropData.map(r => r.height);
            const leaves = cropData.map(r => r.leafCount);

            if (chartInstance) {
                chartInstance.destroy();
            }

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: '草丈 (cm)',
                            data: heights,
                            borderColor: '#10b981',
                            backgroundColor: 'rgba(16, 185, 129, 0.1)',
                            borderWidth: 2,
                            fill: true,
                            tension: 0.3,
                            yAxisID: 'y'
                        },
                        {
                            label: '葉枚数 (枚)',
                            data: leaves,
                            borderColor: '#0284c7',
                            backgroundColor: 'rgba(2, 132, 199, 0.1)',
                            borderWidth: 2,
                            borderDash: [5, 5],
                            tension: 0.3,
                            yAxisID: 'y1'
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        mode: 'index',
                        intersect: false,
                    },
                    plugins: {
                        legend: {
                            position: 'top',
                            labels: {
                                boxWidth: 12,
                                font: { size: 11 }
                            }
                        }
                    },
                    scales: {
                        x: {
                            grid: { display: false },
                            ticks: { font: { size: 10 } }
                        },
                        y: {
                            type: 'linear',
                            display: true,
                            position: 'left',
                            title: { display: true, text: '草丈 (cm)', font: { size: 10 } },
                            min: 0
                        },
                        y1: {
                            type: 'linear',
                            display: true,
                            position: 'right',
                            title: { display: true, text: '葉枚数 (枚)', font: { size: 10 } },
                            min: 0,
                            grid: { drawOnChartArea: false }
                        }
                    }
                }
            });
        }

        // Form Submit Handler (Add / Edit)
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            if (!currentUser) {
                showToast('ログイン状態を確認してください', 'error');
                return;
            }

            const colRef = getCollectionPath();
            if (!colRef) return;

            const payload = {
                cropName: cropNameInput.value.trim(),
                date: logDateInput.value,
                height: parseFloat(plantHeightInput.value),
                leafCount: parseInt(leafCountInput.value, 10),
                notes: notesInput.value.trim(),
                updatedAt: new Date().toISOString()
            };

            const recordId = recordIdInput.value;

            try {
                submitBtn.disabled = true;
                if (recordId) {
                    // Update
                    const docRef = doc(colRef, recordId);
                    await updateDoc(docRef, payload);
                    showToast('記録を更新しました', 'success');
                } else {
                    // Add
                    payload.createdAt = new Date().toISOString();
                    await addDoc(colRef, payload);
                    showToast('新しい記録を保存しました', 'success');
                }
                resetForm();
            } catch (err) {
                console.error("Save Error:", err);
                showToast('保存中にエラーが発生しました', 'error');
            } finally {
                submitBtn.disabled = false;
            }
        });

        // 編集モード準備
        function editRecord(record) {
            recordIdInput.value = record.id;
            cropNameInput.value = record.cropName;
            logDateInput.value = record.date;
            plantHeightInput.value = record.height;
            leafCountInput.value = record.leafCount;
            notesInput.value = record.notes || '';

            formTitle.textContent = "記録の編集";
            submitBtnText.textContent = "更新する";
            cancelEditBtn.classList.remove('hidden');

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // フォームリセット
        function resetForm() {
            recordIdInput.value = '';
            form.reset();
            logDateInput.value = new Date().toISOString().split('T')[0];
            formTitle.textContent = "新規データ入力";
            submitBtnText.textContent = "保存する";
            cancelEditBtn.classList.add('hidden');
        }

        cancelEditBtn.addEventListener('click', resetForm);

        // 削除確認モーダル関係
        const deleteModal = document.getElementById('delete-modal');
        const deleteModalCard = document.getElementById('delete-modal-card');
        const cancelDeleteBtn = document.getElementById('cancel-delete-btn');
        const confirmDeleteBtn = document.getElementById('confirm-delete-btn');

        function promptDelete(id) {
            deleteTargetId = id;
            deleteModal.classList.remove('hidden');
            setTimeout(() => {
                deleteModalCard.classList.remove('scale-95', 'opacity-0');
            }, 10);
        }

        function closeDeleteModal() {
            deleteModalCard.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                deleteModal.classList.add('hidden');
                deleteTargetId = null;
            }, 200);
        }

        cancelDeleteBtn.addEventListener('click', closeDeleteModal);

        confirmDeleteBtn.addEventListener('click', async () => {
            if (!deleteTargetId || !currentUser) return;
            const colRef = getCollectionPath();
            if (!colRef) return;

            try {
                await deleteDoc(doc(colRef, deleteTargetId));
                showToast('記録を削除しました', 'info');
            } catch (err) {
                console.error("Delete error:", err);
                showToast('削除に失敗しました', 'error');
            } finally {
                closeDeleteModal();
            }
        });

        // Event Listeners for Filters
        filterCropSelect.addEventListener('change', renderRecords);
        sortOrderSelect.addEventListener('change', renderRecords);
        chartCropSelect.addEventListener('change', renderChart);

        // ユーティリティ: エスケープ処理
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>"']/g, function(m) {
                return {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                }[m];
            });
        }

        // トースト通知を表示
        function showToast(msg, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-message');
            const toastIcon = document.getElementById('toast-icon');

            toastMsg.textContent = msg;

            if (type === 'success') {
                toastIcon.className = "fa-solid fa-circle-check text-emerald-400";
            } else if (type === 'error') {
                toastIcon.className = "fa-solid fa-circle-xmark text-red-400";
            } else {
                toastIcon.className = "fa-solid fa-circle-info text-sky-400";
            }

            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        // 初期ロード実行
        window.addEventListener('DOMContentLoaded', () => {
            initializeAuth();
        });
    </script>
</body>
</html>
